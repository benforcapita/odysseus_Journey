# Odysseus — production Docker Compose with HTTPS reverse proxy (Caddy)
#
# Usage:
#   1. Copy .env.example to .env and configure secrets
#   2. Set ODYSSEUS_DOMAIN in .env or export it (hostname or IP)
#   3. docker compose -f docker-compose.prod.yml up -d
#
# For GPU passthrough, use one of the GPU overlays:
#   docker compose -f docker-compose.prod.yml -f docker/gpu.nvidia.yml up -d
#
# PWA: Caddy provides HTTPS (required for service-worker registration
# on non-localhost origins), so the PWA install prompt appears in browsers.

services:
  # ── Reverse proxy (TLS termination) ───────────────────────────
  caddy:
    image: docker.io/caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"   # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - ODYSSEUS_DOMAIN=${ODYSSEUS_DOMAIN:-localhost}
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      - odysseus

  # ── Odysseus app ──────────────────────────────────────────────
  odysseus:
    build: .
    restart: unless-stopped
    # Expose only on the internal Docker network — Caddy handles inbound TLS.
    expose:
      - "7000"
    volumes:
      - ./data:/app/data:z
      - ./logs:/app/logs:z
      - ./data/ssh:/app/.ssh:z
      - ./data/huggingface:/app/.cache/huggingface:z
      - ./data/local:/app/.local:z
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LLM_HOST=${LLM_HOST:-localhost}
      - LLM_HOSTS=${LLM_HOSTS:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - RESEARCH_LLM_ENDPOINT=${RESEARCH_LLM_ENDPOINT:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - SEARXNG_INSTANCE=http://searxng:8080
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/app.db}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - LOCALHOST_BYPASS=${LOCALHOST_BYPASS:-false}
      - ODYSSEUS_ADMIN_USER=${ODYSSEUS_ADMIN_USER:-admin}
      - ODYSSEUS_ADMIN_PASSWORD=${ODYSSEUS_ADMIN_PASSWORD:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      - SECURE_COOKIES=${SECURE_COOKIES:-true}
      - EMBEDDING_URL=${EMBEDDING_URL:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - FASTEMBED_MODEL=${FASTEMBED_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - FASTEMBED_CACHE_PATH=${FASTEMBED_CACHE_PATH:-}
      - CLEANUP_INTERVAL_HOURS=${CLEANUP_INTERVAL_HOURS:-24}
      - ODYSSEUS_INPROCESS_POLLERS=${ODYSSEUS_INPROCESS_POLLERS:-1}
      - ODYSSEUS_INPROCESS_TASKS=${ODYSSEUS_INPROCESS_TASKS:-1}
      - ODYSSEUS_SCRIPT_HOST=${ODYSSEUS_SCRIPT_HOST:-localhost}
      - DATA_BRAVE_API_KEY=${DATA_BRAVE_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_PSE_CX=${GOOGLE_PSE_CX:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    depends_on:
      searxng:
        condition: service_healthy
      chromadb:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: ${ODYSSEUS_MEMORY_LIMIT:-4g}
        reservations:
          memory: ${ODYSSEUS_MEMORY_RESERVATION:-512m}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:7000/', timeout=5).read(1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── ChromaDB (vector store) ───────────────────────────────────
  chromadb:
    image: docker.io/chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - chromadb-data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
    deploy:
      resources:
        limits:
          memory: ${CHROMADB_MEMORY_LIMIT:-1g}
        reservations:
          memory: ${CHROMADB_MEMORY_RESERVATION:-256m}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v2/heartbeat', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── SearXNG (private web search) ──────────────────────────────
  searxng:
    image: docker.io/searxng/searxng:2026.5.31-7159b8aed
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ ! -s /etc/searxng/settings.yml ] || grep -q 'odysseus-local-searxng-json-2026-05-30\|__SEARXNG_SECRET__' /etc/searxng/settings.yml; then
          secret="$${SEARXNG_SECRET:-}"
          if [ -z "$$secret" ]; then
            secret="$$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          fi
          sed "s|__SEARXNG_SECRET__|$$secret|g" /tmp/searxng-settings.yml.template > /etc/searxng/settings.yml
        fi
        exec /usr/local/searxng/entrypoint.sh
    volumes:
      - searxng-data:/etc/searxng
      - ./config/searxng/settings.yml:/tmp/searxng-settings.yml.template:ro,z
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: ${SEARXNG_MEMORY_LIMIT:-512m}
        reservations:
          memory: ${SEARXNG_MEMORY_RESERVATION:-128m}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5).read(1)\""]
      interval: 5s
      timeout: 6s
      retries: 20
      start_period: 10s

  # ── ntfy (push notifications) ─────────────────────────────────
  ntfy:
    image: docker.io/binwiederhier/ntfy
    restart: unless-stopped
    command: serve
    volumes:
      - ntfy-cache:/var/cache/ntfy
    environment:
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://localhost:8091}
    deploy:
      resources:
        limits:
          memory: ${NTFY_MEMORY_LIMIT:-128m}
        reservations:
          memory: ${NTFY_MEMORY_RESERVATION:-32m}
    healthcheck:
      test: ["CMD", "ntfy", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  searxng-data:
  chromadb-data:
  ntfy-cache:
  caddy-data:
  caddy-config:
